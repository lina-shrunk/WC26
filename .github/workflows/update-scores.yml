name: Update World Cup scores

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Pull results and update index.html
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: node scripts/update-scores.mjs index.html
      - name: Commit changes if any
        run: |
          if [[ -n "$(git status --porcelain index.html)" ]]; then
            git config user.name "wc-score-bot"
            git config user.email "actions@users.noreply.github.com"
            git add index.html
            git commit -m "Update World Cup scores ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          else
            echo "No score changes to commit."
          fi
